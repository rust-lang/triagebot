[package]
name = "triagebot"
version = "0.1.0"
authors = ["Mark Rousskov <mark.simulacrum@gmail.com>"]
edition = "2024"

[workspace]

[dependencies]
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query", "form"] }
regex = "1"
anyhow = "1"
hex = "0.4"
parser = { path = "parser" }
rust_team_data = { git = "https://github.com/rust-lang/team" }
toml = { version = "0.8", default-features = false, features = ["parse"] }
axum = "0.8.4"
hyper = { version = "1.12", features = ["server", "http1"] }
tokio = { version = "1", features = ["macros", "time", "rt"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1.31"
uuid = { version = "1.23", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
chrono = { version = "0.4.38", features = ["serde"] }
tokio-postgres = { version = "0.7.2", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "tls12"] }
rustls-pki-types = "1.16"
serde_path_to_error = "0.1.2"
octocrab = { version = "0.54", default-features = false, features = ["rustls", "rustls-aws-lc-rs", "default-client", "follow-redirect", "retry", "timeout", "tracing", "stream", "jwt", "jwt-aws-lc-rs"] }
comrak = { version = "0.55", default-features = false }
itertools = "0.15.0"
jsonwebtoken = "10"
tower = { version = "0.5", features = ["util", "limit", "buffer", "load-shed"] }
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip", "request-id", "catch-panic", "trace"] }
rand = "0.10.3"
ignore = "0.4.18"
postgres-types = { version = "0.2.4", features = ["derive"] }
cron = { version = "0.17.0", default-features = false }
bytes = "1.12.0"
clap = { version = "4", default-features = false, features = ["std", "derive", "string", "help", "usage", "error-context"] }
hmac = "0.13.0"
subtle = "2.6.1"
sha2 = "0.11"
gix-imara-diff = { version = "0.3.3", features = ["unified_diff"] }
pulldown-cmark-escape = "0.11.0"
unicode-segmentation = "1.13.3"
secrecy = { version = "0.10", features = ["serde"] }
globset = { version = "0.4.18", default-features = false }
throttle-kit = { version = "3", default-features = false, features = ["in-memory", "tower"] }
http-body-util = "0.1.3"
http = "1.5.0"
memchr = "2.8.3"
semver = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tera]
version = "1.3.1"
default-features = false
features = ["builtins"]

[dev-dependencies]
bon = "3"

[profile.release]
debug = 2
